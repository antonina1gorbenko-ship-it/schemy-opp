<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОПП «Професійна освіта. Цифрові технології» — 2026</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#17324d;--muted:#65788b;--primary:#1f6feb;--border:#dce6f0;--shadow:0 10px 30px rgba(35,65,95,.10)}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#f4f7fb,#eaf2fb);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:32px 20px 50px}.hero{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:42px 34px;box-shadow:var(--shadow);text-align:center}
.badge{display:inline-block;padding:7px 14px;border-radius:999px;background:#e8f1ff;color:#1557b0;font-size:14px;font-weight:700;margin-bottom:14px}
h1{margin:0;font-size:clamp(30px,5vw,46px);line-height:1.12}.hero p{max-width:760px;margin:16px auto 0;color:var(--muted);font-size:17px;line-height:1.6}
.back{display:inline-block;margin-bottom:20px;text-decoration:none;color:var(--primary);font-weight:700}.note{margin-top:24px;padding:18px;border-radius:14px;background:#f8fbff;border:1px dashed #b8cde5;color:var(--muted);line-height:1.55}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="container">
<a class="back" href="../">← До вибору року</a>
<section class="hero">
  <span class="badge">2026</span>
  <h1>ОПП «Професійна освіта. Цифрові технології»</h1>
  <p>Структурно-логічна схема ОПП за 2026 рік.</p>
</section>
<div class="note">
  <strong>Схема ще не додана.</strong><br>
  Завантажте відповідний HTML-файл у цю папку замість цієї сторінки.
</div>
<footer>Цифровий ресурс структурно-логічних схем ОПП</footer>
</div>
</body>
</html>
